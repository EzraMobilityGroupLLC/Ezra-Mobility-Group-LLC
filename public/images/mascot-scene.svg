<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3a5a"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="pinkGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6007e"/>
      <stop offset="100%" stop-color="#ff1493"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="50%" stop-color="#999"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <linearGradient id="tireGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <style>
      @keyframes svg-breathe {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.006); }
      }
      @keyframes svg-blink {
        0%, 94%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.1); }
        98% { transform: scaleY(0.1); }
      }
      @keyframes svg-wave {
        0%, 100% { transform: rotate(0deg); }
        10% { transform: rotate(-8deg); }
        20% { transform: rotate(5deg); }
        30% { transform: rotate(-8deg); }
        40% { transform: rotate(5deg); }
        50% { transform: rotate(-8deg); }
        60%, 100% { transform: rotate(0deg); }
      }
      @keyframes svg-talk {
        0% { transform: scaleY(0.3); }
        100% { transform: scaleY(1); }
      }
      .mascot-body { animation: svg-breathe 4s ease-in-out infinite; transform-origin: 160px 240px; }
      .mascot-eye-l, .mascot-eye-r { animation: svg-blink 4s ease-in-out infinite; }
      .mascot-arm { animation: svg-wave 3s ease-in-out infinite; transform-origin: 185px 215px; }
      .mascot-talking .mascot-mouth { animation: svg-talk 0.3s infinite alternate; }
    </style>
  </defs>

  <!-- ============ SUV - Lincoln Navigator ============ -->
  <g class="suv" transform="translate(140, 100)">
    <!-- Shadow under SUV -->
    <ellipse cx="220" cy="255" rx="230" ry="15" fill="rgba(0,0,0,0.15)"/>

    <!-- Main body -->
    <rect x="20" y="100" width="440" height="140" rx="16" fill="url(#bodyGrad)" stroke="#222" stroke-width="1"/>

    <!-- Body lower trim (pink accent line) -->
    <rect x="20" y="230" width="440" height="10" rx="3" fill="url(#pinkGrad3)" opacity="0.6"/>

    <!-- Cabin / roof -->
    <rect x="90" y="30" width="320" height="80" rx="12" fill="url(#bodyGrad)" stroke="#222" stroke-width="1"/>

    <!-- Rear roofline slope -->
    <path d="M410 30 L420 50 L430 70 L440 100 L460 100" fill="url(#bodyGrad)" stroke="#222" stroke-width="1"/>

    <!-- Windshield -->
    <path d="M95 40 L165 35 L165 100 L95 100 Z" fill="url(#windowGrad)" opacity="0.7"/>
    <!-- Windshield chrome border -->
    <path d="M95 40 L165 35 L165 100 L95 100 Z" fill="none" stroke="#555" stroke-width="1.5"/>

    <!-- Front door window -->
    <rect x="180" y="38" width="80" height="60" rx="6" fill="url(#windowGrad)" opacity="0.7"/>
    <rect x="180" y="38" width="80" height="60" rx="6" fill="none" stroke="#555" stroke-width="1.5"/>

    <!-- Rear door window -->
    <rect x="270" y="38" width="80" height="60" rx="6" fill="url(#windowGrad)" opacity="0.7"/>
    <rect x="270" y="38" width="80" height="60" rx="6" fill="none" stroke="#555" stroke-width="1.5"/>

    <!-- Rear quarter window -->
    <path d="M365 42 L405 55 L405 100 L365 100 Z" fill="url(#windowGrad)" opacity="0.7"/>
    <path d="M365 42 L405 55 L405 100 L365 100 Z" fill="none" stroke="#555" stroke-width="1.5"/>

    <!-- B-Pillar (between front and rear doors) -->
    <rect x="265" y="38" width="5" height="62" fill="#1a1a1a"/>

    <!-- Window decals - semi-transparent text on rear quarter window -->
    <text x="375" y="70" font-family="Montserrat, sans-serif" font-size="8" font-weight="700" fill="white" opacity="0.6" transform="rotate(-20, 375, 70)">EZRA</text>
    <text x="375" y="82" font-family="Montserrat, sans-serif" font-size="5" font-weight="400" fill="white" opacity="0.5" transform="rotate(-20, 375, 82)">MOBILITY GROUP</text>

    <!-- Chrome belt line -->
    <line x1="20" y1="100" x2="460" y2="100" stroke="#888" stroke-width="2"/>

    <!-- Front Grille (left side of SUV) -->
    <rect x="10" y="108" width="20" height="90" rx="6" fill="url(#chromeGrad)" stroke="#777" stroke-width="1"/>
    <!-- Grille cross-hatch -->
    <line x1="15" y1="115" x2="25" y2="115" stroke="#aaa" stroke-width="1"/>
    <line x1="15" y1="125" x2="25" y2="125" stroke="#aaa" stroke-width="1"/>
    <line x1="15" y1="135" x2="25" y2="135" stroke="#aaa" stroke-width="1"/>
    <line x1="15" y1="145" x2="25" y2="145" stroke="#aaa" stroke-width="1"/>
    <line x1="15" y1="155" x2="25" y2="155" stroke="#aaa" stroke-width="1"/>
    <line x1="15" y1="165" x2="25" y2="165" stroke="#aaa" stroke-width="1"/>
    <line x1="15" y1="175" x2="25" y2="175" stroke="#aaa" stroke-width="1"/>
    <line x1="15" y1="185" x2="25" y2="185" stroke="#aaa" stroke-width="1"/>

    <!-- Lincoln star logo on grille -->
    <circle cx="20" cy="160" r="6" fill="#aaa"/>
    <text x="20" y="163" text-anchor="middle" font-size="6" font-weight="bold" fill="#333" font-family="Arial">★</text>

    <!-- Headlight -->
    <ellipse cx="14" cy="108" rx="6" ry="8" fill="#fff" opacity="0.7"/>
    <ellipse cx="14" cy="108" rx="3" ry="4" fill="#fff" opacity="0.9"/>

    <!-- Taillight (rear) -->
    <ellipse cx="458" cy="115" rx="4" ry="10" fill="#ff0000" opacity="0.6"/>

    <!-- ===== PINK METAL BUMPER GUARD (Front) ===== -->
    <!-- Main guard bar across front -->
    <rect x="6" y="225" width="44" height="10" rx="5" fill="url(#pinkGrad3)" stroke="#c00060" stroke-width="1"/>
    <!-- Bumper guard vertical supports -->
    <rect x="12" y="218" width="6" height="20" rx="3" fill="url(#pinkGrad3)" stroke="#c00060" stroke-width="0.5"/>
    <rect x="36" y="218" width="6" height="20" rx="3" fill="url(#pinkGrad3)" stroke="#c00060" stroke-width="0.5"/>
    <!-- Guard highlight -->
    <rect x="8" y="226" width="40" height="3" rx="1.5" fill="#ff69b4" opacity="0.4"/>

    <!-- Rear bumper guard -->
    <rect x="442" y="225" width="20" height="8" rx="4" fill="url(#pinkGrad3)" opacity="0.5"/>

    <!-- Front wheel -->
    <g transform="translate(120, 240)">
      <ellipse cx="0" cy="0" rx="45" ry="18" fill="url(#tireGrad)" stroke="#222" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="28" ry="10" fill="#444" stroke="#666" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="#888"/>
      <!-- Spokes -->
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#666" stroke-width="1.5"/>
      <line x1="-14" y1="-8" x2="14" y2="8" stroke="#666" stroke-width="1.5"/>
      <line x1="-14" y1="8" x2="14" y2="-8" stroke="#666" stroke-width="1.5"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#666" stroke-width="1.5"/>
    </g>

    <!-- Rear wheel -->
    <g transform="translate(370, 240)">
      <ellipse cx="0" cy="0" rx="45" ry="18" fill="url(#tireGrad)" stroke="#222" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="28" ry="10" fill="#444" stroke="#666" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="#888"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#666" stroke-width="1.5"/>
      <line x1="-14" y1="-8" x2="14" y2="8" stroke="#666" stroke-width="1.5"/>
      <line x1="-14" y1="8" x2="14" y2="-8" stroke="#666" stroke-width="1.5"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#666" stroke-width="1.5"/>
    </g>

    <!-- Running boards / side step -->
    <rect x="50" y="232" width="380" height="6" rx="3" fill="#333" stroke="#555" stroke-width="0.5"/>

    <!-- Hood highlight reflection -->
    <rect x="20" y="102" width="120" height="3" rx="1.5" fill="white" opacity="0.06"/>
  </g>

  <!-- ============ MASCOT (leaning on hood) ============ -->
  <g class="mascot" transform="translate(100, 55)">
    <g class="mascot-body">
    <!-- Shadow on ground -->
    <ellipse cx="60" cy="300" rx="40" ry="10" fill="rgba(0,0,0,0.15)"/>

    <!-- ===== LEGS ===== -->
    <!-- Left leg -->
    <rect x="40" y="230" width="16" height="55" rx="6" fill="#1a1a1a"/>
    <!-- Right leg (slightly forward, leaning) -->
    <rect x="60" y="225" width="16" height="60" rx="6" fill="#1a1a1a"/>
    <!-- Shoes -->
    <rect x="38" y="275" width="22" height="10" rx="4" fill="#222"/>
    <rect x="58" y="275" width="22" height="10" rx="4" fill="#222"/>
    <!-- Pink shoelace detail -->
    <rect x="42" y="278" width="14" height="2" rx="1" fill="#e6007e" opacity="0.6"/>
    <rect x="62" y="278" width="14" height="2" rx="1" fill="#e6007e" opacity="0.6"/>

    <!-- ===== TORSO ===== -->
    <!-- Body - lean build -->
    <path d="M35 150 Q30 160 32 200 Q35 230 48 230 L72 230 Q85 230 88 200 Q90 160 85 150 Z" fill="#1a1a1a"/>
    <!-- Shirt front with pink trim -->
    <path d="M45 150 Q42 160 43 200 Q45 225 55 228 L65 228 Q75 225 77 200 Q78 160 75 150 Z" fill="#222"/>
    <!-- Pink vertical stripe on shirt -->
    <rect x="58" y="152" width="4" height="75" rx="2" fill="url(#pinkGrad3)" opacity="0.7"/>
    <!-- Pink collar -->
    <path d="M50 150 L58 160 L66 150" fill="none" stroke="#e6007e" stroke-width="2"/>

    <!-- ===== RIGHT ARM (waving - animated) ===== -->
    <g class="mascot-arm">
      <path d="M85 160 Q110 140 125 115" stroke="#1a1a1a" stroke-width="14" stroke-linecap="round" fill="none"/>
      <circle cx="127" cy="112" r="7" fill="#f0e6d3"/>
      <!-- Pink wristband -->
      <rect x="115" y="120" width="20" height="4" rx="2" fill="#e6007e" transform="rotate(-30, 125, 122)" opacity="0.7"/>
    </g>

    <!-- ===== LEFT ARM (resting on SUV hood) ===== -->
    <path d="M35 165 Q15 180 18 200" stroke="#1a1a1a" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="18" cy="203" r="7" fill="#f0e6d3"/>

    <!-- ===== HEAD ===== -->
    <!-- Neck -->
    <rect x="52" y="132" width="16" height="20" rx="4" fill="#f0e6d3"/>

    <!-- Head shape -->
    <ellipse cx="60" cy="106" rx="30" ry="34" fill="#f0e6d3" stroke="#d4c4a8" stroke-width="0.5"/>

    <!-- ===== HAIR - Blonde with pink bangs, Johnny Bravo style ===== -->
    <!-- Base blonde hair -->
    <path d="M30 100 Q28 65 40 58 Q48 52 60 50 Q72 52 80 58 Q92 65 90 100" fill="#f0d060" stroke="#d4a820" stroke-width="0.5"/>
    <!-- Hair top volume (fluffed up) -->
    <path d="M38 62 Q42 45 55 42 Q65 40 78 45 Q85 50 82 60" fill="#f0d060" stroke="#d4a820" stroke-width="0.5"/>
    <!-- Taller fluff on top -->
    <path d="M45 50 Q50 38 58 36 Q65 35 70 38" fill="#f0d060"/>
    <path d="M52 42 Q56 32 62 30 Q68 32 70 38" fill="#f0d060"/>

    <!-- ===== PINK BANGS - swept left, Johnny Bravo style ===== -->
    <!-- Main pink bang mass -->
    <path d="M35 100 Q30 78 35 65 Q38 58 45 55 Q50 53 55 55 Q48 65 45 80 Q42 90 40 100" fill="#e6007e"/>
    <!-- Fluffed pink bangs swept to the left -->
    <path d="M38 65 Q32 58 36 50 Q40 45 46 48 Q42 55 40 65" fill="#ff1493"/>
    <path d="M42 55 Q36 48 40 42 Q44 38 50 42 Q46 48 44 55" fill="#e6007e"/>
    <path d="M35 75 Q28 68 32 60 Q36 55 40 62 Q38 68 36 75" fill="#ff1493" opacity="0.8"/>
    <!-- Longer pink strand across forehead -->
    <path d="M40 70 Q34 72 30 78 Q28 82 32 84" fill="#e6007e" stroke="#c00060" stroke-width="0.5"/>
    <!-- Additional pink volume on top-left -->
    <path d="M45 48 Q40 38 44 34 Q48 30 52 35 Q48 40 46 48" fill="#e6007e"/>
    <!-- Pink highlight -->
    <path d="M42 58 Q38 52 42 48 Q45 52 44 58" fill="#ff69b4" opacity="0.4"/>

    <!-- Hair on right side -->
    <path d="M82 95 Q88 80 85 68 Q82 60 78 58 Q82 65 84 75 Q86 85 84 95" fill="#f0d060"/>

    <!-- ===== EYES - Blue ===== -->
    <!-- Left eye -->
    <g class="mascot-eye-l">
      <ellipse cx="47" cy="102" rx="5" ry="4.5" fill="white"/>
      <circle cx="48" cy="102" r="3" fill="#4a90d9"/>
      <circle cx="49" cy="101" r="1.2" fill="#1a1a1a"/>
      <circle cx="50" cy="100" r="0.5" fill="white"/>
    </g>

    <!-- Right eye -->
    <g class="mascot-eye-r">
      <ellipse cx="73" cy="102" rx="5" ry="4.5" fill="white"/>
      <circle cx="74" cy="102" r="3" fill="#4a90d9"/>
      <circle cx="75" cy="101" r="1.2" fill="#1a1a1a"/>
      <circle cx="76" cy="100" r="0.5" fill="white"/>
    </g>

    <!-- ===== EYEBROWS ===== -->
    <!-- Left eyebrow -->
    <path d="M40 95 Q47 92 54 95" stroke="#d4a820" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Right eyebrow -->
    <path d="M66 95 Q73 92 80 95" stroke="#d4a820" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- ===== NOSE ===== -->
    <path d="M58 110 Q60 113 62 110" stroke="#d4a820" stroke-width="1" fill="none"/>

    <!-- ===== MOUTH (smiling) ===== -->
    <path d="M48 118 Q60 128 72 118" stroke="#c06060" stroke-width="2" fill="none" class="mascot-mouth" stroke-linecap="round"/>

    <!-- ===== CHEEKS (blush) ===== -->
    <ellipse cx="38" cy="112" rx="5" ry="3" fill="#ffb3b3" opacity="0.35"/>
    <ellipse cx="82" cy="112" rx="5" ry="3" fill="#ffb3b3" opacity="0.35"/>

    <!-- ===== EARS ===== -->
    <ellipse cx="30" cy="106" rx="5" ry="7" fill="#f0e6d3" stroke="#d4c4a8" stroke-width="0.5"/>
    <ellipse cx="90" cy="106" rx="5" ry="7" fill="#f0e6d3" stroke="#d4c4a8" stroke-width="0.5"/>
    </g>
  </g>

  <!-- ============ EMG Branding Overlay ============ -->
  <!-- Semi-transparent EMG watermark on scene -->
  <text x="660" y="340" text-anchor="end" font-family="Montserrat, sans-serif" font-size="14" font-weight="800" fill="#e6007e" opacity="0.12" letter-spacing="3">EMG</text>
  <text x="660" y="355" text-anchor="end" font-family="Montserrat, sans-serif" font-size="7" font-weight="400" fill="#666" opacity="0.10" letter-spacing="2">EZRA MOBILITY GROUP</text>
</svg>
